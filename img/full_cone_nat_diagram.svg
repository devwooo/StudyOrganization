<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>Full Cone NAT 개방 접속 동작</title>
  <desc>Remote를 Any로 매핑하여 외부 PC의 접속도 허용하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="110" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="120" y="130" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">내부 PC</text>
  <text x="120" y="150" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">192.168.0.1:3000</text>

  <rect x="260" y="110" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="130" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">공유기 (NAT)</text>
  <text x="340" y="150" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">3.3.3.3:23000</text>

  <rect x="480" y="42" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="62" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">연결된 서버</text>
  <text x="560" y="82" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">10.10.10.10:40000</text>

  <rect x="480" y="184" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="204" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">외부 PC</text>
  <text x="560" y="224" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">20.20.20.20:40000</text>

  <line x1="200" y1="138" x2="252" y2="138" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="226" y="122" text-anchor="middle" fill="#5F5E5A" font-size="12">요청·응답</text>

  <line x1="420" y1="128" x2="474" y2="82" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="452" y="118" text-anchor="middle" fill="#5F5E5A" font-size="12">정상 통신</text>

  <line x1="474" y1="206" x2="424" y2="160" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <circle cx="450" cy="184" r="11" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="450" y="185" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">✓</text>
  <text x="472" y="176" text-anchor="start" fill="#5F5E5A" font-size="12">접속 가능</text>
</svg>
