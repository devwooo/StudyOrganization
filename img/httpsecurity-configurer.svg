<svg width="700" height="380" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <!-- Builder container -->
  <rect x="40" y="50" width="290" height="290" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="60" y="78" fill="#0C447C" font-size="16" font-weight="600">HttpSecurity</text>
  <text x="60" y="97" fill="#185FA5" font-size="11">extends AbstractConfiguredSecurityBuilder</text>

  <!-- owned list -->
  <rect x="64" y="116" width="242" height="206" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="82" y="140" fill="#0F6E56" font-size="11">소유 (composition · 부모가 보유)</text>
  <text x="82" y="160" fill="#04342C" font-size="14" font-weight="600">List&lt;SecurityConfigurer&gt;</text>

  <rect x="86" y="174" width="198" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="104" y="198" fill="#3C3489" font-size="12">FormLoginConfigurer</text>

  <rect x="86" y="220" width="198" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="104" y="244" fill="#3C3489" font-size="12">CsrfConfigurer</text>

  <rect x="86" y="266" width="198" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="104" y="290" fill="#3C3489" font-size="12">... 기타 Configurer</text>

  <!-- configurer on the right -->
  <rect x="450" y="160" width="210" height="82" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="555" y="192" fill="#712B13" font-size="14" font-weight="600" text-anchor="middle">SecurityConfigurer</text>
  <text x="555" y="214" fill="#993C1D" font-size="12" text-anchor="middle">init(builder)</text>
  <text x="555" y="231" fill="#993C1D" font-size="12" text-anchor="middle">configure(builder)</text>

  <!-- arrow: builder passes this -->
  <text x="390" y="148" fill="#993C1D" font-size="12" text-anchor="middle">this 전달</text>
  <line x1="310" y1="187" x2="442" y2="187" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrowCoral)"/>

  <!-- arrow back: configures the builder -->
  <text x="390" y="264" fill="#0F6E56" font-size="12" text-anchor="middle">빌더를 구성</text>
  <line x1="442" y1="225" x2="310" y2="225" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
</svg>
