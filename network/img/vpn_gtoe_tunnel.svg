<svg width="680" height="210" viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>재택근무 GtoE 터널링 구조</title>
  <desc>자택 PC에서 지사 SG까지 GtoE 터널, 지사에서 서버까지 GtoG 터널로 이어지는 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="230" y="66" text-anchor="middle" fill="#2C2C2A" font-size="14" font-weight="500">① GtoE 터널</text>
  <text x="230" y="82" text-anchor="middle" fill="#5F5E5A" font-size="12">터널링 + 암호화 (한 겹 더)</text>
  <text x="450" y="66" text-anchor="middle" fill="#2C2C2A" font-size="14" font-weight="500">② GtoG 터널</text>
  <text x="450" y="82" text-anchor="middle" fill="#5F5E5A" font-size="12">지사 → 서버 재암호화</text>

  <rect x="40" y="90" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="120" y="110" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">자택 PC</text>
  <text x="120" y="128" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">VPN Client · 새 IP</text>

  <rect x="260" y="90" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="110" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">지사 SG</text>
  <text x="340" y="128" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">Security Gateway</text>

  <rect x="480" y="90" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="110" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">본사 서버</text>
  <text x="560" y="128" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">목적지</text>

  <line x1="200" y1="118" x2="258" y2="118" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="118" x2="478" y2="118" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="340" y="182" text-anchor="middle" fill="#5F5E5A" font-size="12">GtoE = GtoG에 자택→지사 터널이 한 겹 더 얹힌 것</text>
</svg>
