<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>Symmetric와 Full Cone의 외부 포트 배정 비교</title>
  <desc>같은 내부 소켓이 두 서버와 통신할 때 외부 포트가 어떻게 배정되는지 비교</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="26" fill="#2C2C2A" font-size="14" font-weight="500">Symmetric — 목적지마다 외부 포트 다름 (1:N)</text>

  <rect x="40" y="66" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="120" y="86" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">내부 소켓</text>
  <text x="120" y="104" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">192.168.0.1:3000</text>

  <rect x="490" y="46" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="565" y="66" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">서버 A</text>
  <rect x="490" y="116" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="565" y="136" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">서버 B</text>

  <line x1="200" y1="84" x2="484" y2="66" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="60" text-anchor="middle" fill="#854F0B" font-size="14" font-weight="500">ext :23000</text>
  <line x1="200" y1="102" x2="484" y2="136" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="146" text-anchor="middle" fill="#854F0B" font-size="14" font-weight="500">ext :23001</text>

  <line x1="40" y1="188" x2="640" y2="188" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

  <text x="40" y="222" fill="#2C2C2A" font-size="14" font-weight="500">Full Cone — 외부 포트 항상 고정 (1:1)</text>

  <rect x="40" y="262" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="120" y="282" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">내부 소켓</text>
  <text x="120" y="300" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">192.168.0.1:3000</text>

  <rect x="490" y="242" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="565" y="262" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">서버 A</text>
  <rect x="490" y="312" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="565" y="332" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">서버 B</text>

  <line x1="200" y1="280" x2="484" y2="262" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="256" text-anchor="middle" fill="#0F6E56" font-size="14" font-weight="500">ext :23000</text>
  <line x1="200" y1="298" x2="484" y2="332" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="342" text-anchor="middle" fill="#0F6E56" font-size="14" font-weight="500">ext :23000</text>
</svg>
