<svg width="680" height="556" viewBox="0 0 680 556" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>네트워크 접속부터 인터넷 통신까지의 흐름</title>
  <desc>DHCP로 IP를 받고 ARP로 MAC을 찾고 NAT로 인터넷에 나가는 순서</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="180" y="40" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="14" font-weight="500">기기 부팅 · LAN 연결</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">아직 IP 주소가 없음</text>
  <line x1="340" y1="96" x2="340" y2="124" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="126" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">DHCP</text>
  <text x="340" y="164" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">IP · 게이트웨이 · DNS 자동 할당</text>
  <line x1="340" y1="182" x2="340" y2="210" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="212" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="232" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="14" font-weight="500">목적지 확인</text>
  <text x="340" y="250" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">같은 LAN인가, 외부(인터넷)인가</text>
  <line x1="340" y1="268" x2="340" y2="296" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="298" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="318" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">ARP</text>
  <text x="340" y="336" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">게이트웨이의 MAC 주소 획득</text>
  <line x1="340" y1="354" x2="340" y2="382" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="384" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="404" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">NAT (라우터)</text>
  <text x="340" y="422" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">사설 IP → 공인 IP 변환</text>
  <line x1="340" y1="440" x2="340" y2="468" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="470" width="320" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="490" text-anchor="middle" dominant-baseline="central" fill="#27500A" font-size="14" font-weight="500">인터넷 서버 도달</text>
  <text x="340" y="508" text-anchor="middle" dominant-baseline="central" fill="#3B6D11" font-size="12">응답은 NAT Table로 역변환되어 복귀</text>
</svg>
